name: Generate Kalshi_Climate_Markets Report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run climate script
        run: |
          mkdir -p reports
          node climate_bot.js > reports/latest.log

      - name: Commit and push the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p reports
          git add reports/latest.log

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update climate report - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
