name: Generate Kalshi_Climate_Markets Report

on:
  workflow_dispatch:
  # Backup only. Cloudflare hourly cron is the primary clock.
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: climate-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trading window (America/Chicago)
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          NOW=$(TZ=America/Chicago date +%H%M)
          echo "chicago_hhmm=$NOW event=$EVENT_NAME"
          if [ "$NOW" -ge 1915 ]; then
            echo "After 19:15 CT — skip"
            echo "run=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=1" >> "$GITHUB_OUTPUT"
          echo "flatten=0" >> "$GITHUB_OUTPUT"
          echo "mode=full" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.window.outputs.run == '1'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run climate script
        if: steps.window.outputs.run == '1'
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FLATTEN_EOD: ${{ steps.window.outputs.flatten }}
        run: |
          mkdir -p reports
          node scan.js > reports/latest.log 2> reports/latest.err
          if [ -s reports/latest.err ]; then
            echo "----- stderr -----" >> reports/latest.log
            cat reports/latest.err >> reports/latest.log
          fi
          echo "===== latest.log ====="
          cat reports/latest.log
