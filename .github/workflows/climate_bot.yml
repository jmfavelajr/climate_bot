name: Generate Kalshi_Climate_Markets Report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply live-sigma confidence patch
        run: node apply_confidence_patch.js

      - name: Run climate script
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: |
          mkdir -p reports
          if [ -z "$KALSHI_API_KEY_ID" ] || [ -z "$KALSHI_PRIVATE_KEY" ]; then
            echo "Missing KALSHI_API_KEY_ID or KALSHI_PRIVATE_KEY repo secrets" >&2
          fi
          node climate_bot.js > reports/latest.log 2> reports/latest.err
          if [ -s reports/latest.err ]; then
            echo "----- stderr -----" >> reports/latest.log
            cat reports/latest.err >> reports/latest.log
          fi

      - name: Commit and push the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p reports
          git add reports/latest.log reports/latest.err || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update climate report - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
