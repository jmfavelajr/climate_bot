name: Generate Kalshi_Climate_Markets Report

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trading window (America/Chicago)
        id: window
        run: |
          NOW=$(TZ=America/Chicago date +%H%M)
          MIN=$(TZ=America/Chicago date +%M)
          echo "chicago_hhmm=$NOW"
          if [ "$NOW" -ge 1915 ]; then
            echo "After 19:15 CT — skip"
            echo "run=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=1" >> "$GITHUB_OUTPUT"
          if [ "$NOW" -ge 1900 ]; then
            echo "flatten=1" >> "$GITHUB_OUTPUT"
          else
            echo "flatten=0" >> "$GITHUB_OUTPUT"
          fi
          if [ "$MIN" = "00" ] || [ "$MIN" = "20" ] || [ "$MIN" = "40" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=manage" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.window.outputs.run == '1'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run climate script
        if: steps.window.outputs.run == '1'
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FLATTEN_EOD: ${{ steps.window.outputs.flatten }}
        run: |
          mkdir -p reports
          if [ "${{ steps.window.outputs.mode }}" = "full" ]; then
            node scan.js > reports/latest.log 2> reports/latest.err
          else
            echo "Kalshi manage-only $(TZ=America/Chicago date -Iseconds)" > reports/latest.log
            node manage_only.js >> reports/latest.log 2> reports/latest.err
          fi
          if [ -s reports/latest.err ]; then
            echo "----- stderr -----" >> reports/latest.log
            cat reports/latest.err >> reports/latest.log
          fi

      - name: Commit and push the report
        if: steps.window.outputs.run == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p reports
          git add reports/latest.log reports/latest.err || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update climate report - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
