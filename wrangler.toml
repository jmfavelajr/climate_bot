name = "clima-markets-report-fetch"
main = "worker.js"
compatibility_date = "2026-07-30"

# Wake every minute. worker.js only dispatches when check_interval seconds have elapsed.
[triggers]
crons = ["* * * * *"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
