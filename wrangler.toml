name = "clima-markets-report-fetch"
main = "worker.js"
compatibility_date = "2026-07-30"

# Primary clock: once per hour (UTC minute 0).
[triggers]
crons = ["0 * * * *"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
